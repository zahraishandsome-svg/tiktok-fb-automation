name: Upload Slot 2 (1AM PKT)

on:
  schedule:
    - cron: "0 20 * * *"   # 20:00 UTC = 1:00 AM PKT
  workflow_dispatch:
    inputs:
      channel:
        description: "Optional: run only this channel ID"
        required: false
        default: ""
      dry_run:
        description: "Dry run (no actual upload)"
        type: boolean
        default: false

concurrency:
  group: fb-uploads
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore DB cache
        uses: actions/cache@v4
        with:
          path: data/automation.db
          key: fb-automation-db-${{ github.sha }}-${{ github.run_id }}
          restore-keys: |
            fb-automation-db-${{ github.sha }}-
            fb-automation-db-

      - name: Restore credentials and tokens
        env:
          PAGE_1_CREDENTIALS: ${{ secrets.PAGE_1_CREDENTIALS }}
          PAGE_1_TOKEN: ${{ secrets.PAGE_1_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          mkdir -p credentials tokens
          echo "$PAGE_1_CREDENTIALS" | base64 -d > credentials/page_1_credentials.json
          echo "$PAGE_1_TOKEN"       | base64 -d > tokens/page_1_token.json
          printf "DISCORD_WEBHOOK_URL=%s\nLOG_LEVEL=INFO\n" "$DISCORD_WEBHOOK_URL" > .env
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "DRY_RUN=true" >> .env
          fi

      - name: Run slot 2
        run: |
          CHANNEL_ARG=""
          if [ -n "${{ github.event.inputs.channel }}" ]; then
            CHANNEL_ARG="--channel ${{ github.event.inputs.channel }}"
          fi
          python run.py --slot 2 $CHANNEL_ARG

      - name: Save DB cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/automation.db
          key: fb-automation-db-${{ github.run_id }}

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-slot2-${{ github.run_id }}
          path: logs/
          retention-days: 14
