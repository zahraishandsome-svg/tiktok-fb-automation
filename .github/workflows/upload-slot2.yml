name: Upload Slot 2 Page 1 (10PM PKT)

on:
  schedule:
    - cron: "0 17 * * *"   # 17:00 UTC — publish immediately on upload (no scheduling)
  workflow_dispatch:
    inputs:
      channel:
        description: "Optional: run only this channel ID"
        required: false
        default: ""
      dry_run:
        description: "Dry run (no actual upload)"
        type: boolean
        default: false

env:
  DB_PAGE_ID: page_1

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore DB cache
        uses: actions/cache@v4
        with:
          path: data/page_1.db
          key: fb-automation-db-page_1-${{ github.sha }}-${{ github.run_id }}
          restore-keys: |
            fb-automation-db-page_1-${{ github.sha }}-
      - name: Restore credentials and tokens
        env:
          PAGE_1_CREDENTIALS: ${{ secrets.PAGE_1_CREDENTIALS }}
          PAGE_1_TOKEN: ${{ secrets.PAGE_1_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          mkdir -p credentials tokens
          if [ -n "$PAGE_1_CREDENTIALS" ]; then
            echo "$PAGE_1_CREDENTIALS" | base64 -d > credentials/page_1_credentials.json
          fi
          if [ -n "$PAGE_1_TOKEN" ]; then
            echo "$PAGE_1_TOKEN" | base64 -d > tokens/page_1_token.json
          fi
          printf "DISCORD_WEBHOOK_URL=%s\nLOG_LEVEL=INFO\n" "$DISCORD_WEBHOOK_URL" > .env
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "DRY_RUN=true" >> .env
          fi

      - name: Write TikTok cookies
        env:
          TIKTOK_COOKIES: ${{ secrets.TIKTOK_COOKIES }}
        run: |
          if [ -n "$TIKTOK_COOKIES" ]; then
            echo "$TIKTOK_COOKIES" | base64 -d > /tmp/tiktok_cookies.txt
            echo "TIKTOK_COOKIES_FILE=/tmp/tiktok_cookies.txt" >> $GITHUB_ENV
          fi

      - name: Run slot 2
        run: python run.py --slot 2 --channel page_1

      - name: Save DB cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/page_1.db
          key: fb-automation-db-page_1-${{ github.sha }}-${{ github.run_id }}

      - name: Commit DB to repo
        if: always()
        run: |
          if [ ! -f data/page_1.db ]; then
            echo "No DB file found — skipping commit"
            exit 0
          fi
          cp data/page_1.db /tmp/page_1_new.db
          git fetch origin main
          git checkout -B main origin/main
          cp /tmp/page_1_new.db data/page_1.db
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/page_1.db
          if ! git diff --staged --quiet; then
            git commit -m "chore: update page_1.db [skip ci]"
            git push origin main
          else
            echo "No DB changes to commit"
          fi

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-slot2-page1-${{ github.run_id }}
          path: logs/
          retention-days: 14
