name: Upload Slot 1 (8PM PKT)

on:
  schedule:
    - cron: "0 15 * * *"   # 15:00 UTC = 8:00 PM PKT
  workflow_dispatch:
    inputs:
      channel:
        description: "Optional: run only this channel ID"
        required: false
        default: ""
      dry_run:
        description: "Dry run (no actual upload)"
        type: boolean
        default: false

concurrency:
  group: fb-uploads
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore DB cache
        uses: actions/cache@v4
        with:
          path: data/automation.db
          key: fb-automation-db-${{ github.sha }}-${{ github.run_id }}
          restore-keys: |
            fb-automation-db-${{ github.sha }}-
            fb-automation-db-

      - name: Restore credentials and tokens
        env:
          PAGE_1_CREDENTIALS: ${{ secrets.PAGE_1_CREDENTIALS }}
          PAGE_1_TOKEN: ${{ secrets.PAGE_1_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          mkdir -p credentials tokens
          echo "$PAGE_1_CREDENTIALS" | base64 -d > credentials/page_1_credentials.json
          echo "$PAGE_1_TOKEN"       | base64 -d > tokens/page_1_token.json
          printf "DISCORD_WEBHOOK_URL=%s\nLOG_LEVEL=INFO\n" "$DISCORD_WEBHOOK_URL" > .env
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "DRY_RUN=true" >> .env
          fi

      - name: Run slot 1
        run: |
          CHANNEL_ARG=""
          if [ -n "${{ github.event.inputs.channel }}" ]; then
            CHANNEL_ARG="--channel ${{ github.event.inputs.channel }}"
          fi
          python run.py --slot 1 $CHANNEL_ARG

      - name: Save DB cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/automation.db
          key: fb-automation-db-${{ github.run_id }}

      - name: Commit DB to repo
        if: always()
        run: |
          if [ ! -f data/automation.db ]; then
            echo "No DB file found — skipping commit"
            exit 0
          fi
          cp data/automation.db /tmp/automation_new.db
          git fetch origin main
          git checkout -B main origin/main
          cp /tmp/automation_new.db data/automation.db
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/automation.db
          if ! git diff --staged --quiet; then
            git commit -m "chore: update automation.db [skip ci]"
            git push origin main
          else
            echo "No DB changes to commit"
          fi

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-slot1-${{ github.run_id }}
          path: logs/
          retention-days: 14
